name: Morning brief

on:
  schedule:
    - cron: "30 10 * * *"   # 6:30 AM EDT / 5:30 AM EST, before the commute
  workflow_dispatch: {}      # "Run workflow" button for testing

permissions:
  contents: write

concurrency: brief

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      - name: Commit store and published brief
        run: |
          git config user.name "caz-brief-bot"
          git config user.email "caz-brief-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Brief for $(TZ=America/New_York date +%F)"
          git push
